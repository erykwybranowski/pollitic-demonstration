server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    access_log /var/log/pollitic/access.log privacy;
    error_log /var/log/pollitic/error.log warn;

    # The publishing renderer deliberately keeps its existing browser-only
    # route. Playwright loads this static application and waits for it itself.
    location ~ "^/social-render/[0-9A-Fa-f-]{36}$" {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location = /refresh {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Neutral comparison URLs must reach Express for the language redirect.
    # Only explicitly localized party comparisons remain CSR.
    location ~ "^/[a-z]{2}/compare/[a-z]{2}/[^/]+$" {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location ^~ /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public pages and static assets are handled by Angular's SSR server. The
    # server sends SSR HTML for routes and immutable files directly for assets.
    location / {
        proxy_pass http://frontend-ssr:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
